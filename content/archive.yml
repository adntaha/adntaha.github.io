    - name: Fracture detection (MYP personal project)
      year: 2023-24
      url: https://github.com/adntaha/pp-detection-fracture-recherche
      blurb: compared seven models across five datasets for spotting bone fractures in X-rays, and shipped a Flutter demo app.
      note: "this one is also [how i got into AI safety](/blog/my-path-to-ai-safety/)"
    - name: Robotics team, CRC MØ-DUEL 2026
      year: "2026"
      blurb: i programmed the robot arm for my CEGEP's team. we won 3rd place for the game itself, with Rookie of the Year, Never Say Die and Outstanding Participation awards.
      note: "in french, never say die is \"didn't drop the potato.\" lol"
