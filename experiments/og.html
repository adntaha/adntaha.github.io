<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social card</title>
<style>
  @font-face {
    font-family: 'Fraunces';
    src: url('../public/fonts/fraunces.woff2') format('woff2');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'Aidan Hand';
    src: url('../public/fonts/aidan-hand.woff2') format('woff2');
  }

  /* the site's colours (src/css/base.css): whiteboard, and blackboard for dark */
  :root {
    --paper: #f9fafa;
    --ink: #1b1d20;
    --muted: #1b1d20; /* subheaders: solid, same as the name */
    --note: #1d4fc4; /* blue marker */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #232625;
      --ink: #ecebe6;
      --muted: #f3f2ec; /* subheaders: solid white in dark */
      --note: #f3f2ec; /* white chalk */
    }
  }
  :root[data-theme='dark'] {
    --paper: #232625;
    --ink: #ecebe6;
    --muted: #f3f2ec; /* subheaders: solid white in dark */
    --note: #f3f2ec;
  }
  /* chalk: only on the blackboard */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) .twirl { filter: url(#chalk); }
  }
  :root[data-theme='dark'] .twirl { filter: url(#chalk); }

  * { box-sizing: border-box; margin: 0; }
  body { background: #888; }

  .card {
    width: 1200px;
    height: 630px;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'SOFT' 100, 'WONK' 0;
    font-weight: 600;
    font-size: 148px;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .line {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'SOFT' 100;
    font-weight: 400;
    font-size: 44px;
    color: var(--muted);
  }

  /* Fraunces' ampersand is ornate; set it plainly, in the system font */
  .amp {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.9em;
  }

  .line.sub { font-size: 34px; margin-top: -12px; }

  /* the hand-drawn touch: a chain of loops, from bottom centre to right centre, in blue marker */
  .twirl {
    position: absolute;
    inset: 0;
    width: 1200px;
    height: 630px;
    fill: none;
    stroke: var(--note);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .doodles { stroke-width: 5; }

  .underline {
    position: absolute;
    left: 80px;
    top: 330px;
    width: 560px;
    height: 24px;
    fill: none;
    stroke: var(--note);
    stroke-width: 6;
    stroke-linecap: round;
  }
</style>

<script>
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme) document.documentElement.dataset.theme = theme;
</script>
